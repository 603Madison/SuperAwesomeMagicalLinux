<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SuperAwesomeMagicalLinux's fonts: Lexend for everything, like the apps, with Cascadia Code (Nerd
  Font build, so terminals get icons) for code. Numbered 50 so these come ahead of Fedora's own
  choices (fontconfig gives earlier preferences priority); Noto still covers scripts Lexend lacks.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Lexend</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Lexend</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Cascadia Code NF</family></prefer>
  </alias>
</fontconfig>
