# SuperAwesomeMagicalLinux's terminal. Its colours follow the desktop's colour scheme: the shell
# sets them when the scheme changes, and fish applies them as each terminal opens.
# A ~/.config/foot/foot.ini of your own replaces this file.

shell=fish
font=Cascadia Code NF:size=11
pad=16x16
dpi-aware=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.92
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
