  <defs>
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="124">
      <stop offset="0" stop-color="#CFBDFF"/>
      <stop offset="0.55" stop-color="#9F8CFF"/>
      <stop offset="1" stop-color="#6EF2B0"/>
    </linearGradient>
  </defs>
  <path fill="url(#aurora)" d="M56 12 C61 56 72 67 116 72 C72 77 61 88 56 124 C51 88 40 77 4 72 C40 67 51 56 56 12 Z"/>
  <path fill="#6EF2B0" d="M106 4 C108 17 111 20 124 22 C111 24 108 27 106 40 C104 27 101 24 88 22 C101 20 104 17 106 4 Z"/>
