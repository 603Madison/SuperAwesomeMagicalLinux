# Installer settings for bootc-image-builder's anaconda-iso. The workflow fills in @IMAGE_REF@.
#
# Giving our own kickstart keeps the installer interactive (you choose the disk); without one,
# bootc-image-builder makes an unattended installer that wipes the first disk.
#
# Making an account is required: this desktop has no first-run account wizard, so an install
# without one can't be signed in to. The installer insists on an administrator account (or a root
# password) before it will start, but only while the kickstart says nothing about root: any
# `rootpw` line, even `rootpw --lock`, counts to the installer as "an admin is already set up" and
# makes the account screens optional. So there's no rootpw here; root stays locked by default.
# The ISO workflow refuses to build if one appears.
#
# (bootc-image-builder adds the `bootc switch` below itself too; it points installed systems at
# the published image so they update from it.)

[customizations.installer.kickstart]
contents = """
%post --erroronfail
bootc switch --mutate-in-place --transport registry @IMAGE_REF@
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Localization",
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
