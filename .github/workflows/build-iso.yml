name: Build installer ISO

# Makes an installer ISO from the published image, automatically after every "Build image" run that
# publishes one (and by hand from the Actions tab whenever wanted). The ISO carries the whole OS, so
# it installs offline; installed systems then update from the registry.
#
# The ISO and its checksum are attached to the run as an artifact for a few days; the run's summary
# page lists its size and SHA-256.

on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
  workflow_dispatch:

# A newer image makes any ISO still being built from an older one pointless.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE_NAME: superawesomemagicallinux

jobs:
  iso:
    # By hand, or after a "Build image" run that published: one that succeeded on the default
    # branch, from anything but a pull request (those only build and check).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      # The installer settings from the same commit the image was built from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pull the published image
        id: image
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:latest"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          sudo podman pull "${ref}"
          echo "version=$(sudo podman image inspect "${ref}" --format '{{ index .Labels "org.opencontainers.image.version" }}')" >> "$GITHUB_OUTPUT"

      - name: Build the ISO
        env:
          REF: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          mkdir -p output
          sed "s|@IMAGE_REF@|${REF}|g" disk_config/iso.toml > output/config.toml
          # Any rootpw line makes the installer's account screens optional (see iso.toml), and an
          # install without an account can't be signed in to.
          if grep -qE '^[[:space:]]*rootpw' output/config.toml; then
            echo "::error file=disk_config/iso.toml::rootpw in the kickstart would make creating an account optional"
            exit 1
          fi
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v ./output/config.toml:/config.toml:ro \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "${REF}"
          iso="SuperAwesomeMagicalLinux-${VERSION:-$(date -u +%Y%m%d)}.iso"

          # Our look for the installer (disk_config/installer/branding.py), made in the image itself
          # (it has Pillow and Lexend), added as /images/product.img by mkksiso, Fedora's own tool for
          # adding files to an installer ISO: it replays the ISO's boot records as they are. If they
          # don't come out the same (bar positions), the unbranded ISO is kept, so an install always
          # boots. (The disc label stays bootc-image-builder's: changing it means rewriting the EFI
          # boot image, which can't be tried out without booting it.)
          mkdir -p output/add/images
          sudo podman run --rm -v ./build_files:/b:ro -v ./disk_config/installer:/i:ro -v ./output/add/images:/o \
            "${REF}" python3 /i/branding.py /b "/usr/share/fonts/lexend/Lexend[wght].ttf" /o/product.img
          if sudo podman run --rm -v ./output:/o "${REF}" bash -c '
            set -euo pipefail
            dnf -y -q install lorax >/dev/null
            mkksiso --skip-mkefiboot --add /o/add/images /o/bootiso/install.iso /o/branded.iso
            boot() { # the boot records, without where on the disc they are
              xorriso -indev "$1" -report_el_torito plain -report_system_area plain 2>/dev/null |
                grep -E "^El Torito (boot img|img (path|opts))|^System area (options|summary)" |
                sed -E "s/^(El Torito boot img .*[^ ]) +[0-9]+$/\1/"
            }
            diff <(boot /o/bootiso/install.iso) <(boot /o/branded.iso)'
          then
            sudo mv output/branded.iso "output/${iso}"
          else
            echo "::warning::Adding the installer's look changed the ISO's boot records; publishing it without"
            sudo mv output/bootiso/install.iso "output/${iso}"
          fi
          sudo rm -rf output/bootiso output/add output/branded.iso
          sudo chown -R "$(id -u):$(id -g)" output
          (cd output && sha256sum "${iso}" > SHA256SUMS)
          echo "ISO=${iso}" >> "$GITHUB_ENV"
          ls -lh output

      - name: Check the ISO
        run: |
          iso="output/${ISO}"
          size=$(stat -c %s "${iso}")
          echo "size: $((size / 1048576)) MiB"
          # A real installer is gigabytes; anything small means the build went wrong.
          test "${size}" -gt $((1024 * 1048576))
          # Bootable ISO 9660 with an EFI boot image.
          command -v xorriso >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xorriso; }
          file "${iso}" | tee /dev/stderr | grep -q "ISO 9660"
          xorriso -indev "${iso}" -report_el_torito plain 2>/dev/null | tee /dev/stderr | grep -qi "uefi\|efi"
          if xorriso -indev "${iso}" -ls /images/product.img 2>/dev/null | grep -q product.img; then
            echo "The installer has our look (images/product.img)."
          else
            echo "::warning::The installer has Fedora's look this time (no images/product.img)."
          fi
          {
            echo "### ${ISO}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.image.outputs.ref }}\` (${{ steps.image.outputs.version }}) |"
            echo "| Size | $((size / 1048576)) MiB |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 output/SHA256SUMS)\` |"
            echo
            echo "Download it from **Artifacts** below, write it to a USB stick, and boot from it."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO }}
          path: |
            output/*.iso
            output/SHA256SUMS
          retention-days: 3
          compression-level: 0
