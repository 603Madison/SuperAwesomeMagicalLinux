name: Build image

# Builds the OS image and, on the default branch, publishes it to GitHub's container registry.
# Installed systems update from there, so the daily rebuild is how Fedora's and Universal Blue's
# fixes reach them, and follow-apps.yml starts one when one of the family's apps (SuperAwesomeMagical
# Browser, whose releases carry Firefox's security fixes, Music or Email) has a new release. Other
# branches and pull requests only build and check.

on:
  push:
    paths-ignore: ["**.md", "tools/**", ".github/workflows/build-iso.yml", "disk_config/**"]
  pull_request:
    paths-ignore: ["**.md", "tools/**"]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: superawesomemagicallinux
  FEDORA_VERSION: "45"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Work out names and tags
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          # The family's apps' newest releases, built in and labelled on the image (follow-apps.yml
          # compares the labels with the newest releases). Email may have none yet.
          for app in Browser Music Email; do
            tag=$(build_files/newest-release.sh "603Madison/SuperAwesomeMagical$app")
            echo "${app,,}=$tag" >> "$GITHUB_OUTPUT"
            echo "SuperAwesomeMagical$app: ${tag:-no release yet}"
          done

      - name: Build
        run: |
          sudo podman build \
            --pull=newer \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            --build-arg IMAGE_REF="${{ steps.meta.outputs.registry }}/${IMAGE_NAME}" \
            --build-arg BROWSER_TAG="${{ steps.meta.outputs.browser }}" \
            --build-arg MUSIC_TAG="${{ steps.meta.outputs.music }}" \
            --build-arg EMAIL_TAG="${{ steps.meta.outputs.email }}" \
            --label org.opencontainers.image.title="SuperAwesomeMagicalLinux" \
            --label org.opencontainers.image.description="Fedora ${FEDORA_VERSION}, image-based, with the SuperAwesomeMagical desktop" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.version="${FEDORA_VERSION}.${{ steps.meta.outputs.date }}.${{ github.run_number }}" \
            --label io.github.603madison.superawesomemagicalbrowser="${{ steps.meta.outputs.browser }}" \
            --label io.github.603madison.superawesomemagicalmusic="${{ steps.meta.outputs.music }}" \
            --label io.github.603madison.superawesomemagicalemail="${{ steps.meta.outputs.email }}" \
            --label containers.bootc=1 \
            --tag "localhost/${IMAGE_NAME}:latest" \
            --file Containerfile .

      - name: Check the image
        run: sudo podman run --rm "localhost/${IMAGE_NAME}:latest" /usr/libexec/superawesomemagical/check-image

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io --username "${{ github.actor }}" --password-stdin
          sudo podman push --compression-format=zstd:chunked \
            "localhost/${IMAGE_NAME}:latest" "${REGISTRY}/${IMAGE_NAME}:latest"
          # The other tags are copied inside the registry, so the image is compressed and uploaded
          # once (pushing each tag from podman recompresses all of it every time).
          command -v skopeo >/dev/null || sudo apt-get install -y skopeo
          for tag in "${FEDORA_VERSION}" "${FEDORA_VERSION}-${DATE}"; do
            sudo skopeo copy --all --preserve-digests \
              "docker://${REGISTRY}/${IMAGE_NAME}:latest" "docker://${REGISTRY}/${IMAGE_NAME}:${tag}"
          done
